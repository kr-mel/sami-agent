name = "sami-agent-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# أصل الموقع المسموح له (CORS). صفحة الايجنت المستقلة + أي مضيف على kr-mel.github.io
[vars]
ALLOWED_ORIGIN = "https://kr-mel.github.io"

# المفاتيح سرّية — لا تُكتب هنا أبداً. تُضبط عبر:
#   wrangler secret put GEMINI_API_KEYS
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "3001"
simple = { limit = 20, period = 60 }
