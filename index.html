<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سامي · مساعد متجر الحلويات الذكي</title>
  <meta name="description" content="سامي — مساعد ذكاء اصطناعي لمتجر حلويات شامية. يردّ بالعربية والتركية والإنجليزية. مشروع عرض (Portfolio)." />
  <meta property="og:title" content="سامي · مساعد متجر الحلويات الذكي" />
  <meta property="og:description" content="مساعد ذكاء اصطناعي متعدد اللغات لمتجر حلويات — عرض تجريبي." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#EFE7D6; --bg2:#FAF7F0;
      --card:#FFFFFF; --surface:#F6F2E8; --surface-2:#FBF8F1;
      --green:#0F2519; --green2:#173824; --gold:#D4AF37; --gold2:#eacb63;
      --text:#1C1917; --muted:#6B655E; --line:#E3DCCB;
      --bot-bg:#FFFFFF; --bot-text:#241f1c; --bot-border:#EAE3D3;
      --chip-bg:#FFFFFF; --chip-text:#0F2519; --chip-border:#DCD3BE;
      --field-bg:#FFFFFF; --field-text:#1C1917;
      --shadow:0 24px 60px -24px rgba(15,37,25,.28);
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg1:#0a140d; --bg2:#0f1c14;
        --card:#13241a; --surface:#182c20; --surface-2:#12211a;
        --green:#efe9dc; --green2:#1c3527; --gold:#e6c463; --gold2:#f0d68a;
        --text:#F1ECE1; --muted:#a7b0a6; --line:#294034;
        --bot-bg:#1a2f23; --bot-text:#F1ECE1; --bot-border:#294034;
        --chip-bg:#1a2f23; --chip-text:#F1ECE1; --chip-border:#33503f;
        --field-bg:#12211a; --field-text:#F1ECE1;
        --shadow:0 24px 60px -24px rgba(0,0,0,.6);
      }
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'Cairo',system-ui,sans-serif;color:var(--text);
      background:
        radial-gradient(70% 55% at 100% -5%, rgba(212,175,55,.18), transparent 60%),
        radial-gradient(60% 50% at -5% 105%, rgba(15,37,25,.16), transparent 60%),
        linear-gradient(160deg,var(--bg1),var(--bg2));
      min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;
    }
    .app{
      width:100%;max-width:640px;height:min(88dvh,760px);display:flex;flex-direction:column;
      background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;
      box-shadow:var(--shadow);
    }
    /* Header */
    header{display:flex;align-items:center;gap:.8rem;padding:.95rem 1.1rem;
      background:linear-gradient(135deg,var(--green2),var(--green));border-bottom:1px solid rgba(212,175,55,.25)}
    .avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0F2519;
      display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-weight:700;font-size:1.55rem;
      box-shadow:0 4px 14px -3px rgba(212,175,55,.6)}
    .h-info{flex:1;display:flex;flex-direction:column;gap:.15rem;min-width:0}
    .h-title{font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:1.08rem;color:#fff}
    .h-sub{font-size:.75rem;color:#cfe0d4;display:flex;align-items:center;gap:.4rem}
    .dot{width:8px;height:8px;border-radius:50%;background:#5be584;box-shadow:0 0 0 0 rgba(91,229,132,.6);animation:pulse 2s infinite;flex-shrink:0}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,229,132,.5)}70%{box-shadow:0 0 0 7px rgba(91,229,132,0)}100%{box-shadow:0 0 0 0 rgba(91,229,132,0)}}
    /* Language switch */
    .langs{display:flex;gap:.3rem;background:rgba(255,255,255,.12);padding:.25rem;border-radius:9999px}
    .lang{border:none;background:transparent;color:#efe6cf;border-radius:9999px;
      padding:.32rem .62rem;font-family:'Cairo';font-size:.8rem;font-weight:700;cursor:pointer;transition:.2s;line-height:1}
    .lang:hover{color:#fff}
    .lang.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0F2519;box-shadow:0 3px 10px -3px rgba(212,175,55,.6)}
    /* Chat */
    .chat{flex:1;overflow-y:auto;padding:1.1rem 1rem .6rem;display:flex;flex-direction:column;gap:.7rem;background:var(--surface)}
    .msg{max-width:86%;padding:.72rem 1rem;border-radius:1.15rem;font-size:.95rem;line-height:1.65;
      white-space:pre-wrap;word-wrap:break-word;animation:in .35s cubic-bezier(.16,1,.3,1)}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .bot{background:var(--bot-bg);color:var(--bot-text);border:1px solid var(--bot-border);
      align-self:flex-start;border-bottom-inline-start-radius:.35rem;box-shadow:0 4px 14px -8px rgba(15,37,25,.25)}
    .user{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;
      align-self:flex-end;border-bottom-inline-end-radius:.35rem}
    .bot strong{color:var(--gold)}
    .typing{display:flex;gap:.3rem;align-items:center}
    .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.55;animation:ty 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
    @keyframes ty{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
    /* Chips */
    .chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:.4rem 1rem .2rem;background:var(--surface)}
    .chip{border:1.5px solid var(--chip-border);background:var(--chip-bg);color:var(--chip-text);
      border-radius:9999px;padding:.5rem .95rem;font-family:'Cairo';font-size:.83rem;font-weight:600;cursor:pointer;transition:.2s}
    .chip:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
    /* Input */
    .inputbar{display:flex;gap:.6rem;padding:.8rem 1rem;background:var(--card);border-top:1px solid var(--line)}
    .field{flex:1;border:1.5px solid var(--line);background:var(--field-bg);color:var(--field-text);
      border-radius:9999px;padding:.8rem 1.2rem;font-family:'Cairo';font-size:.95rem;outline:none;transition:.2s;min-width:0}
    .field::placeholder{color:var(--muted)}
    .field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18)}
    .send{width:48px;height:48px;flex-shrink:0;border-radius:50%;border:none;cursor:pointer;
      background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0F2519;
      display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 6px 16px -5px rgba(212,175,55,.65)}
    .send:hover{transform:translateY(-2px)}
    .send:active{transform:translateY(0)}
    .send svg{width:20px;height:20px}
    [dir="rtl"] .send svg{transform:scaleX(-1)}
    .badge{text-align:center;font-size:.68rem;color:var(--muted);padding:.5rem 0 .7rem}
    a{color:var(--gold)}
    @media(max-width:560px){
      body{padding:0}
      .app{height:100dvh;max-width:100%;border-radius:0;border:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">س</div>
      <div class="h-info">
        <span class="h-title" id="title">سامي · مساعد الحلويات</span>
        <span class="h-sub"><i class="dot"></i><span id="status">مساعد ذكاء اصطناعي · يردّ فوراً</span></span>
      </div>
      <div class="langs">
        <button class="lang active" data-l="ar">ع</button>
        <button class="lang" data-l="tr">TR</button>
        <button class="lang" data-l="en">EN</button>
      </div>
    </header>

    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="chips" id="chips"></div>

    <form class="inputbar" id="form">
      <input class="field" id="field" type="text" autocomplete="off" maxlength="1000" />
      <button class="send" type="submit" aria-label="send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
    <div class="badge" id="badge"></div>
  </div>

  <script>
    const API_URL = 'https://sami-agent-api.vercel.app/api/chat';
    const T = {
      ar:{title:'سامي · مساعد الحلويات',status:'مساعد ذكاء اصطناعي · يردّ فوراً',ph:'اكتب رسالتك…',
        greet:'أهلاً وسهلاً! 🌰 أنا سامي، مساعد ذكاء اصطناعي لمتجر حلويات شامية. اسألني عن البقلاوة، الكنافة، المعمول، أو علب الهدايا!',
        err:'عذراً، صار خطأ مؤقت. جرّب مرة ثانية 🙏',
        badge:'عرض تجريبي (Portfolio) · مدعوم بالذكاء الاصطناعي',
        chips:['شو عندكم؟','بكم البقلاوة؟','في شي خالي غلوتين؟','بدي علبة هدية']},
      tr:{title:'Sami · Tatlı Asistanı',status:'Yapay zekâ asistanı · anında yanıt',ph:'Mesajınızı yazın…',
        greet:'Hoş geldiniz! 🌰 Ben Sami, bir Şam tatlıları mağazası için yapay zekâ asistanıyım. Baklava, künefe, mamul veya hediye kutuları hakkında sorun!',
        err:'Üzgünüm, geçici bir hata oluştu. Tekrar deneyin 🙏',
        badge:'Portfolyo demo · Yapay zekâ destekli',
        chips:['Menü nedir?','Baklava ne kadar?','Glutensiz var mı?','Hediye kutusu istiyorum']},
      en:{title:'Sami · Sweets Assistant',status:'AI assistant · instant replies',ph:'Type your message…',
        greet:'Welcome! 🌰 I’m Sami, an AI assistant for a Damascus sweet shop. Ask me about baklava, kunafa, maamoul, or gift boxes!',
        err:'Sorry, a temporary error occurred. Please try again 🙏',
        badge:'Portfolio demo · Powered by AI',
        chips:['What do you have?','How much is baklava?','Anything gluten-free?','I want a gift box']}
    };
    let lang='ar', busy=false, history=[];
    const chat=document.getElementById('chat'), field=document.getElementById('field'),
      chips=document.getElementById('chips'), form=document.getElementById('form');

    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    function fmt(t){let s=esc(t);s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');s=s.replace(/^\s*[*-]\s+/gm,'• ');return s.replace(/\n/g,'<br>');}
    function add(text,who){const el=document.createElement('div');el.className='msg '+who;
      if(who==='bot')el.innerHTML=fmt(text);else el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;}
    function typing(){const el=document.createElement('div');el.className='msg bot typing';
      el.innerHTML='<span></span><span></span><span></span>';chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;}

    function renderChips(){chips.innerHTML='';T[lang].chips.forEach(c=>{const b=document.createElement('button');
      b.className='chip';b.textContent=c;b.onclick=()=>{if(!busy)send(c)};chips.appendChild(b);});}
    function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
      document.getElementById('title').textContent=t.title;document.getElementById('status').textContent=t.status;
      field.placeholder=t.ph;document.getElementById('badge').textContent=t.badge;renderChips();}
    function resetChat(){chat.innerHTML='';history=[];add(T[lang].greet,'bot');chips.style.display='flex';}

    async function send(text){
      if(busy||!text.trim())return;busy=true;chips.style.display='none';
      add(text,'user');history.push({role:'user',text});field.value='';
      const ty=typing();
      try{
        const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({message:text,history:history.slice(0,-1)})});
        const data=await res.json();ty.remove();
        const reply=data.reply||data.error||T[lang].err;
        add(reply,'bot');history.push({role:'model',text:reply});
      }catch(e){ty.remove();add(T[lang].err,'bot');}
      finally{busy=false;field.focus();}
    }

    form.addEventListener('submit',e=>{e.preventDefault();send(field.value);});
    document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{
      document.querySelector('.lang.active').classList.remove('active');b.classList.add('active');
      lang=b.dataset.l;applyLang();resetChat();}));

    applyLang();resetChat();field.focus();
  </script>
</body>
</html>
